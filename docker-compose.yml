services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: socioeconomic_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - "5000:80"    # Web UI
      - "25:25"      # SMTP server

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # Frontend nuevo en React (coexiste con el Angular; migración por fases)
  frontend-react:
    build: ./frontend-react
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend-react:/app
      - frontend_react_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
  frontend_react_node_modules:
